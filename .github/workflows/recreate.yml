name: Generate Device Tree

on:
  workflow_dispatch:
    inputs:
      vendor_boot_url:
        description: 'Direct download URL to stock vendor_boot.img'
        required: true
        default: 'https://github.com/Classity-Real/lineage-X6525/releases/download/DeviceTree/vendor_boot.img'
      warning:
        description: 'You are allowing this to recreate the device tree to stock by your download link. It will remove everything what is inside and can only regenerate device tree.'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio python3-pip lz4 brotli
          pip3 install twrpdtgen
      - name: Download vendor_boot.img
        run: |
          curl -L "${{ github.event.inputs.vendor_boot_url }}" -o vendor_boot.img
      - name: Verify download
        run: |
               ls -la vendor_boot.img
               file vendor_boot.img
      - name: Debug - manually run AIK unpack
        run: |
          git clone https://github.com/SebaUbuntu/AIK-Linux-mirror aik
          cp vendor_boot.img aik/
          cd aik
          chmod +x unpackimg.sh
          ./unpackimg.sh vendor_boot.img || true
      - name: Generate device tree
        run: |
          python3 -m twrpdtgen vendor_boot.img -o output --git -d
      - name: Commit generated tree to main
        run: |
          git config --global user.name "Device Tree Bot"
          git config --global user.email "actions@github.com"
          
          TREE_DIR=$(find output -name ".git" -exec dirname {} \; | head -1)
          cd "$TREE_DIR"
          git checkout -b main
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push -f origin main
