name: Build Lineage Recovery

on:
  workflow_dispatch:
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
                      /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h /

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python-is-python3 openjdk-11-jdk

      - name: Cache repo
        uses: actions/cache@v4
        with:
          path: |
            ~/lineage/.repo
            ~/lineage/.repo/projects
            ~/lineage/.repo/project-objects
          key: repo-lineage-20-${{ hashFiles('local_manifests/*.xml') }}
          restore-keys: |
            repo-lineage-20-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      - name: Configure git & ccache
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
          echo "USE_CCACHE=1" >> $GITHUB_ENV
          echo "CCACHE_EXEC=$(which ccache)" >> $GITHUB_ENV
          echo "CCACHE_COMPRESS=1" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=20G" >> $GITHUB_ENV

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Init LineageOS 20
        run: |
          mkdir -p ~/lineage && cd ~/lineage
          repo init \
            --depth=1 \
            --partial-clone \
            --clone-filter=blob:none \
            --no-tags \
            -u https://github.com/LineageOS/android.git \
            -b lineage-20

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: _device_tree

      - name: Place device tree & local manifest
        run: |
          mkdir -p ~/lineage/device/infinix/X6525
          cp -a _device_tree/. ~/lineage/device/infinix/X6525/
          mkdir -p ~/lineage/.repo/local_manifests
          cp _device_tree/local_manifests/roomservice.xml \
             ~/lineage/.repo/local_manifests/roomservice.xml

      - name: Decompress prebuilt kernel
        run: |
          cd ~/lineage/device/infinix/X6525/prebuilt
          if [ -f kernel.gz ]; then
            echo "Decompressing kernel.gz..."
            gunzip -k -f kernel.gz
            rm -f kernel.gz
          fi
          ls -la
          file kernel
          if head -c 2 kernel | xxd | grep -q '1f8b'; then
            echo "::error::kernel is still compressed!"
            exit 1
          fi
          echo "✅ Kernel is decompressed and ready."

      - name: Sync sources
        run: |
          cd ~/lineage
          repo sync -c -j$(nproc --all) \
            --force-sync --no-clone-bundle --no-tags \
            --optimized-fetch --prune

      - name: Build recovery
        run: |
          cd ~/lineage
          source build/envsetup.sh
          ccache -M 20G
          lunch lineage_X6525-userdebug
          mka recoveryimage -j$(nproc --all)

      - name: Upload recovery image
        uses: actions/upload-artifact@v4
        with:
          name: recovery-X6525-${{ github.run_number }}
          path: |
            ~/lineage/out/target/product/X6525/recovery.img
          if-no-files-found: error
          retention-days: 14

      - name: Show ccache stats
        if: always()
        run: ccache -s