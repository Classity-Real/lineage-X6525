name: Generate Device Tree

on:
  workflow_dispatch:
    inputs:
      vendor_boot_url:
        description: 'Direct download URL to stock vendor_boot.img'
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio python3-pip
          pip3 install twrpdtgen

      - name: Download vendor_boot.img
        run: |
          curl -L "${{ github.event.inputs.vendor_boot_url }}" -o vendor_boot.img

      - name: Generate device tree
        run: |
          python3 -m twrpdtgen vendor_boot.img -o output --git

      - name: Upload generated tree
        uses: actions/upload-artifact@v4
        with:
          name: generated-device-tree
          path: output/